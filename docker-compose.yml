version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pg-gpt-db
    restart: always
    environment:
      POSTGRES_USER: gptadmin
      POSTGRES_PASSWORD: secretgpt
      POSTGRES_DB: gptarchive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./server
    container_name: gpt-backend
    restart: always
    env_file:
      - ./server/.env
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx-gpt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./client/dist:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  pgdata:
